name: Build GitHub Action
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
      - "migration/**"
    paths:
      - "packages/github-action/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "test/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - "Makefile"
      - ".github/workflows/build-github-action.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate GitHub Action
        run: make validate-github-action TEST_LANGUAGE=all

      - name: Verify committed GitHub Action bundle is up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- packages/github-action/dist/index.js; then
            echo "::error::packages/github-action/dist/index.js is out of date. Run 'make package-github-action' and commit the updated bundle."
            exit 1
          fi
