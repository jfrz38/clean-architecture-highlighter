name: Create Releases

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release:
    name: Create ${{ matrix.package.release_name }} release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - release_name: CLI
            package_key: cli
            tag_prefix: cli-v
            package_name: "@jfrz38/clean-architecture-highlighter-cli"
            package_dir: packages/cli
            package_file: packages/cli/package.json
            compare_source: registry
            compare_ref: ""
            registry: npm
            validate_command: make validate-cli TEST_LANGUAGE=all
            package_command: make package-cli
            asset_path: ""
          - release_name: ESLint Plugin
            package_key: eslint-plugin
            tag_prefix: eslint-plugin-v
            package_name: "@jfrz38/eslint-plugin-clean-architecture-highlighter"
            package_dir: packages/eslint-plugin
            package_file: packages/eslint-plugin/package.json
            compare_source: registry
            compare_ref: ""
            registry: npm
            validate_command: make validate-eslint-plugin
            package_command: make package-eslint-plugin
            asset_path: ""
          - release_name: GitHub Action
            package_key: github-action
            tag_prefix: github-action-v
            package_name: "@jfrz38/clean-architecture-highlighter-github-action"
            package_dir: packages/github-action
            package_file: packages/github-action/package.json
            compare_source: git-ref
            compare_ref: HEAD^
            registry: auto
            validate_command: make validate-github-action TEST_LANGUAGE=all
            package_command: make package-github-action
            asset_path: ""
          - release_name: VS Code Extension
            package_key: vscode-extension
            tag_prefix: vscode-extension-v
            package_name: jfrz38.clean-architecture-highlighter
            package_dir: packages/vscode-extension
            package_file: packages/vscode-extension/package.json
            compare_source: registry
            compare_ref: ""
            registry: vscode-marketplace
            validate_command: xvfb-run -a make validate-vscode-extension
            package_command: make package-vscode-extension
            asset_path: packages/vscode-extension/clean-architecture-highlighter-{version}.vsix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: version-check
        name: Check version is releasable
        uses: jfrz38/check-version-change@v1
        with:
          file-path: ${{ matrix.package.package_file }}
          compare-file-path: ${{ matrix.package.package_file }}
          package-name: ${{ matrix.package.package_name }}
          compare-source: ${{ matrix.package.compare_source }}
          compare-ref: ${{ matrix.package.compare_ref }}
          registry: ${{ matrix.package.registry }}

      - name: Skip already published version
        if: steps.version-check.outputs.changed != 'true'
        run: |
          echo "${{ matrix.package.package_name }} ${{ steps.version-check.outputs.local-version }} is already published; no release to create."

      - name: Verify version can be released
        if: steps.version-check.outputs.changed == 'true'
        run: |
          if [ -n "${{ steps.version-check.outputs.compared-version }}" ] && [ "${{ steps.version-check.outputs.is-higher }}" != "true" ]; then
            echo "Version ${{ steps.version-check.outputs.local-version }} is not higher than published version ${{ steps.version-check.outputs.compared-version }}" >&2
            exit 1
          fi

      - name: Install pnpm
        if: steps.version-check.outputs.changed == 'true'
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.1.3

      - name: Setup Node
        if: steps.version-check.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.version-check.outputs.changed == 'true'
        run: make ci-install

      - name: Validate package
        if: steps.version-check.outputs.changed == 'true'
        run: ${{ matrix.package.validate_command }}

      - name: Resolve release version
        if: steps.version-check.outputs.changed == 'true'
        id: version
        working-directory: ${{ matrix.package.package_dir }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve package version" >&2
            exit 1
          fi

          if [ "$VERSION" != "${{ steps.version-check.outputs.local-version }}" ]; then
            echo "Resolved version $VERSION does not match checked version ${{ steps.version-check.outputs.local-version }}" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=${{ matrix.package.tag_prefix }}$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_tag=${{ matrix.package.tag_prefix }}${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Package release asset
        if: steps.version-check.outputs.changed == 'true' && matrix.package.asset_path != ''
        run: ${{ matrix.package.package_command }}

      - name: Create or update exact version tag
        if: steps.version-check.outputs.changed == 'true'
        env:
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists. Skipping exact version tag update."
          else
            git tag "$VERSION_TAG"
            git push origin "refs/tags/$VERSION_TAG"
          fi

      - name: Force-update GitHub Action major version tag
        if: steps.version-check.outputs.changed == 'true' && matrix.package.package_key == 'github-action'
        env:
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
        run: |
          git tag -f "$MAJOR_TAG"
          git push origin "refs/tags/$MAJOR_TAG" --force

      - name: Create GitHub release
        if: steps.version-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_PATH_TEMPLATE: ${{ matrix.package.asset_path }}
        run: |
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION_TAG already exists. Skipping release creation."
          else
            if [ -n "$ASSET_PATH_TEMPLATE" ]; then
              ASSET_PATH="${ASSET_PATH_TEMPLATE//\{version\}/$VERSION}"
              gh release create "$VERSION_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$VERSION_TAG" \
                --generate-notes \
                --latest=true \
                "$ASSET_PATH"
            else
              gh release create "$VERSION_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$VERSION_TAG" \
                --generate-notes \
                --latest=true
            fi
          fi
