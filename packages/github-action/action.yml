name: Clean Architecture Highlighter
description: Run Clean Architecture dependency boundary checks in GitHub Actions.
inputs:
  path:
    description: Project path or source folder to check.
    required: false
    default: .
  config:
    description: Optional path to a JSON configuration file.
    required: false
  source-folder:
    description: Optional source folder relative to the project root.
    required: false
  format:
    description: Output format. Supported values are text and json.
    required: false
    default: text
runs:
  using: node20
  main: dist/index.js
